services:
  app:
    build: .
    image: longevity100x-web
    ports:
      - "8787:8787"
    environment:
      # Read from .env next to this file (never commit it). Ask uses Workers AI, which wrangler dev
      # runs on Cloudflare, so it needs a token with Workers AI permission. Leave empty to run without Ask.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    volumes:
      # Local D1 database (accounts and sessions).
      - wrangler-state:/app/server/ask-worker/.wrangler
    restart: unless-stopped

volumes:
  wrangler-state:
